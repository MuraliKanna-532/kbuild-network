name: KBuild Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          unzip -o kbuild-project.zip -d project

      - name: Install dependencies
        working-directory: ./project
        run: |
          npm install
          npm install --save-dev typescript@6.0.0

      - name: Build Android project
        working-directory: ./project
        run: |
          echo "TypeScript version:"
          npx tsc --version

          echo "Sync Capacitor:"
          npx cap sync android

          echo "Build APK:"
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Build APK
        working-directory: ./project
        run: |
          mkdir -p ../output
          cp android/app/build/outputs/apk/debug/app-debug.apk ../output/KBuild.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KBuild-APK
          path: output/KBuild.apk
