name: KBuild Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Find and Extract Project ZIP
        run: |
          echo "Searching for ZIP file..."

          ZIP_FILE=$(find . -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found in repository."
            echo "Files in repository:"
            find . -maxdepth 2 -type f | head -100
            exit 1
          fi

          echo "Found ZIP: $ZIP_FILE"

          rm -rf project
          mkdir -p project

          unzip -o "$ZIP_FILE" -d project

          echo "Extracted files:"
          find project -maxdepth 3 -type f | head -100

      - name: Find Project Directory
        run: |
          PROJECT_DIR=$(find project -name package.json -type f -print -quit | xargs dirname)

          if [ -z "$PROJECT_DIR" ] || [ "$PROJECT_DIR" = "." ]; then
            echo "ERROR: package.json not found inside extracted project."
            find project -maxdepth 4 -type f
            exit 1
          fi

          echo "Project directory: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: |
          cd "$PROJECT_DIR"

          npm install

          npm install --save-dev typescript@6.0.0

      - name: Check TypeScript
        run: |
          cd "$PROJECT_DIR"

          echo "TypeScript version:"
          npx tsc --version

      - name: Build Android project
        run: |
          cd "$PROJECT_DIR"

          echo "Sync Capacitor:"
          npx cap sync android

          echo "Build APK:"
          cd android

          chmod +x gradlew

          ./gradlew assembleDebug

      - name: Prepare APK
        run: |
          cd "$PROJECT_DIR"

          mkdir -p "$GITHUB_WORKSPACE/output"

          cp android/app/build/outputs/apk/debug/app-debug.apk \
             "$GITHUB_WORKSPACE/output/KBuild.apk"

      - name: Upload APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: KBuild-APK
          path: output/KBuild.apk
