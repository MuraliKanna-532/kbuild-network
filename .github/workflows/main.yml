name: KBuild Network REAL FINAL Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:

      # =====================================================
      # 1. CHECKOUT
      # =====================================================
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      # =====================================================
      # 2. CHECK ENVIRONMENT
      # =====================================================
      - name: Check environment
        run: |
          echo "======================================"
          echo "ENVIRONMENT"
          echo "======================================"

          node --version
          npm --version
          java --version || true

      # =====================================================
      # 3. INSTALL JAVA 21
      # =====================================================
      - name: Install Java 21
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-21-jdk

          echo "JAVA_HOME=/usr/lib/jvm/java-21-openjdk-amd64" >> "$GITHUB_ENV"
          echo "/usr/lib/jvm/java-21-openjdk-amd64/bin" >> "$GITHUB_PATH"

          echo "======================================"
          echo "JAVA VERSION"
          echo "======================================"

          java --version

      # =====================================================
      # 4. FIND KBUILD SOURCE ZIP
      # =====================================================
      - name: Find KBuild source ZIP
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "SEARCHING FOR KBUILD ZIP"
          echo "======================================"

          ZIP_FILE=$(find . -maxdepth 1 -type f \
            -name 'KBuild_Network*.zip' \
            | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo ""
            echo "ERROR: KBuild source ZIP not found."
            echo ""
            echo "ZIP files available in repository:"
            find . -type f -name "*.zip" -print || true
            echo ""

            exit 1
          fi

          echo "KBUILD SOURCE ZIP FOUND:"
          echo "$ZIP_FILE"

          echo "SOURCE_ZIP=$ZIP_FILE" >> "$GITHUB_ENV"

      # =====================================================
      # 5. EXTRACT SOURCE ZIP
      # =====================================================
      - name: Extract KBuild source
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "EXTRACTING KBUILD SOURCE"
          echo "======================================"

          rm -rf extracted
          mkdir -p extracted

          unzip -o "$SOURCE_ZIP" -d extracted

          echo ""
          echo "Extracted files:"
          find extracted -maxdepth 4 -type f -print | head -300

      # =====================================================
      # 6. FIND REAL INDEX.HTML
      # =====================================================
      - name: Find real KBuild interface
        shell: bash
        run: |
          set -e

          REAL_INDEX=""

          echo "======================================"
          echo "SEARCHING FOR REAL KBUILD INDEX"
          echo "======================================"

          while IFS= read -r FILE; do

            echo "Checking: $FILE"

            if grep -q "Construction Marketplace" "$FILE"; then

              if ! grep -q "KBuild Network mobile application" "$FILE"; then
                REAL_INDEX="$FILE"
                break
              fi

            fi

          done < <(find extracted -type f -name "index.html")

          if [ -z "$REAL_INDEX" ]; then
            echo ""
            echo "ERROR: Real KBuild interface not found."
            echo ""

            echo "Available index.html files:"
            find extracted -type f -name "index.html" -print || true

            echo ""
            echo "Searching for Construction Marketplace:"
            grep -RIl "Construction Marketplace" extracted \
              --include="*.html" \
              --include="*.js" \
              --include="*.tsx" \
              --include="*.jsx" \
              2>/dev/null || true

            exit 1
          fi

          echo ""
          echo "REAL KBUILD INTERFACE FOUND:"
          echo "$REAL_INDEX"

          echo "REAL_INDEX=$REAL_INDEX" >> "$GITHUB_ENV"

      # =====================================================
      # 7. PREPARE WEBSITE
      # =====================================================
      - name: Prepare real KBuild website
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "PREPARING WEBSITE"
          echo "======================================"

          rm -rf www
          mkdir -p www

          WEB_ROOT=$(dirname "$REAL_INDEX")

          echo "Website root:"
          echo "$WEB_ROOT"

          cp -a "$WEB_ROOT"/. www/

          echo ""
          echo "Website files:"
          find www -maxdepth 4 -type f -print | head -300

          echo ""
          echo "index.html:"
          wc -c www/index.html

      # =====================================================
      # 8. VALIDATE WEBSITE
      # =====================================================
      - name: Validate REAL KBuild website
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "VALIDATING KBUILD WEBSITE"
          echo "======================================"

          test -f www/index.html

          grep -q "Construction Marketplace" www/index.html

          if grep -q "KBuild Network mobile application" www/index.html; then
            echo "ERROR: Placeholder website detected."
            exit 1
          fi

          echo ""
          echo "REAL KBUILD WEBSITE CONFIRMED"

      # =====================================================
      # 9. CREATE PACKAGE.JSON
      # =====================================================
      - name: Create Capacitor package
        shell: bash
        run: |
          set -e

          cat > package.json <<'EOF'
          {
            "name": "kbuild-network-real-mobile",
            "version": "2.0.0",
            "private": true,
            "description": "KBuild Network real mobile application",
            "dependencies": {
              "@capacitor/core": "^7.4.3"
            },
            "devDependencies": {
              "@capacitor/cli": "^7.4.3",
              "@capacitor/android": "^7.4.3"
            }
          }
          EOF

          echo "package.json created."

      # =====================================================
      # 10. CREATE CAPACITOR CONFIG
      # =====================================================
      - name: Create Capacitor configuration
        shell: bash
        run: |
          set -e

          rm -f capacitor.config.ts
          rm -f capacitor.config.json

          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.kbuild.network.real",
            "appName": "KBuild Network",
            "webDir": "www",
            "server": {
              "androidScheme": "https"
            }
          }
          EOF

          echo "Capacitor configuration created."

      # =====================================================
      # 11. INSTALL NPM DEPENDENCIES
      # =====================================================
      - name: Install dependencies
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "INSTALLING NPM DEPENDENCIES"
          echo "======================================"

          npm install

      # =====================================================
      # 12. CREATE FRESH ANDROID PROJECT
      # =====================================================
      - name: Create fresh Android project
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "CREATING ANDROID PROJECT"
          echo "======================================"

          rm -rf android

          npx cap add android

      # =====================================================
      # 13. SYNC WEBSITE TO ANDROID
      # =====================================================
      - name: Sync REAL KBuild website
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "SYNCING WEBSITE TO ANDROID"
          echo "======================================"

          npx cap sync android

      # =====================================================
      # 14. VERIFY ANDROID WEBSITE BUNDLE
      # =====================================================
      - name: Verify Android website bundle
        shell: bash
        run: |
          set -e

          BUNDLED_INDEX="android/app/src/main/assets/public/index.html"

          echo "======================================"
          echo "VERIFYING ANDROID WEBSITE"
          echo "======================================"

          test -f "$BUNDLED_INDEX"

          echo "Android index size:"
          wc -c "$BUNDLED_INDEX"

          grep -q "Construction Marketplace" "$BUNDLED_INDEX"

          if grep -q "KBuild Network mobile application" "$BUNDLED_INDEX"; then
            echo "ERROR: Placeholder reached Android bundle."
            exit 1
          fi

          echo ""
          echo "REAL WEBSITE IS INSIDE ANDROID"

      # =====================================================
      # 15. BUILD APK
      # =====================================================
      - name: Build REAL FINAL APK
        working-directory: android
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "BUILDING APK"
          echo "======================================"

          chmod +x gradlew

          ./gradlew clean

          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace

      # =====================================================
      # 16. VERIFY APK
      # =====================================================
      - name: Verify final APK
        shell: bash
        run: |
          set -e

          APK="android/app/build/outputs/apk/debug/app-debug.apk"

          echo "======================================"
          echo "VERIFYING FINAL APK"
          echo "======================================"

          test -f "$APK"

          echo ""
          echo "FINAL APK CREATED:"
          ls -lh "$APK"

      # =====================================================
      # 17. UPLOAD APK
      # =====================================================
      - name: Upload KBuild REAL FINAL APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: KBuild-Network-REAL-FINAL-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
