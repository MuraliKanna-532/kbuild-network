name: KBuild Network Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      # 2. Check environment
      - name: Check environment
        run: |
          echo "Node:"
          node --version

          echo "NPM:"
          npm --version

          echo "Java:"
          java --version

      # 3. Install Java 21
      - name: Install Java 21
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-21-jdk

          echo "JAVA_HOME=/usr/lib/jvm/java-21-openjdk-amd64" >> "$GITHUB_ENV"
          echo "/usr/lib/jvm/java-21-openjdk-amd64/bin" >> "$GITHUB_PATH"

          java --version

      # 4. Find and extract the real KBuild Network source ZIP
      - name: Extract KBuild Network source
        run: |
          ZIP_FILE=$(find . -type f -iname '*KBuild_Network_GITHUB_UPLOAD_READY*.zip' | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: KBuild Network source ZIP not found"
            exit 1
          fi

          echo "Found source ZIP:"
          echo "$ZIP_FILE"

          rm -rf source
          mkdir -p source

          unzip -q "$ZIP_FILE" -d source

          echo "Extracted files:"
          find source -maxdepth 2 -type f -print

      # 5. Copy real website files
      - name: Prepare real KBuild Network website
        run: |
          cp -a source/. .

          echo "Website files:"
          ls -lah

          test -f index.html
          test -f kbuild-logo.png
          test -f package.json

          echo "Real KBuild Network website found"

      # 6. Create clean web directory
      - name: Prepare Capacitor web directory
        run: |
          rm -rf www
          mkdir -p www

          cp index.html www/
          cp kbuild-logo.png www/

          if [ -f robots.txt ]; then
            cp robots.txt www/
          fi

          if [ -f sitemap.xml ]; then
            cp sitemap.xml www/
          fi

          echo "www directory:"
          find www -maxdepth 2 -type f -print

      # 7. Create Capacitor configuration
      - name: Configure Capacitor
        run: |
          rm -f capacitor.config.ts

          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.kbuild.network",
            "appName": "KBuild Network",
            "webDir": "www",
            "server": {
              "androidScheme": "https"
            }
          }
          EOF

          cat capacitor.config.json

      # 8. Install dependencies
      - name: Install dependencies
        run: |
          npm install

      # 9. Remove any old Android project
      - name: Prepare Android platform
        run: |
          rm -rf android

      # 10. Create Android project
      - name: Add Android platform
        run: |
          npx cap add android

      # 11. Sync real KBuild Network website
      - name: Sync Capacitor
        run: |
          npx cap sync android

      # 12. Check Android project
      - name: Check Android project
        run: |
          test -f android/gradlew
          test -f android/app/build.gradle

          echo "Android project created successfully"

      # 13. Build APK
      - name: Build Android APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace --no-daemon

      # 14. Verify APK
      - name: Verify APK
        run: |
          echo "APK files:"
          find android/app/build/outputs/apk -type f -name "*.apk" -print

          test -f android/app/build/outputs/apk/debug/app-debug.apk

          echo "APK successfully created"

      # 15. Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: KBuild-Network-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
