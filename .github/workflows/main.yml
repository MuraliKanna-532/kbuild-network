name: KBuild Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Find project
        run: |
          echo "Searching for package.json..."
          find . -name package.json -not -path './.git/*'

      - name: Install dependencies
        run: |
          PROJECT_DIR=$(dirname "$(find . -name package.json -not -path './.git/*' | head -1)")
          echo "Project: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          npm install

      - name: Build Android project
        run: |
          PROJECT_DIR=$(dirname "$(find . -name package.json -not -path './.git/*' | head -1)")
          cd "$PROJECT_DIR"
          npx cap add android
          npx cap sync android
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug

      - name: Save APK
        run: |
          PROJECT_DIR=$(dirname "$(find . -name package.json -not -path './.git/*' | head -1)")
          mkdir -p apk-output
          cp "$PROJECT_DIR/android/app/build/outputs/apk/debug/app-debug.apk" apk-output/KBuild-Network.apk
