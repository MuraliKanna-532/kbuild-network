name: KBuild Network REAL Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Install Java 21
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-21-jdk

          echo "JAVA_HOME=/usr/lib/jvm/java-21-openjdk-amd64" >> "$GITHUB_ENV"
          echo "/usr/lib/jvm/java-21-openjdk-amd64/bin" >> "$GITHUB_PATH"

      - name: Find exact source ZIP
        run: |
          ZIP_FILE=$(find . -type f -name 'KBuild_Network_GITHUB_UPLOAD_READY.zip' | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "Exact source ZIP not found."
            echo "ZIP files available:"
            find . -type f -name "*.zip"
            exit 1
          fi

          echo "Using:"
          echo "$ZIP_FILE"

          echo "SOURCE_ZIP=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Extract REAL KBuild website
        run: |
          rm -rf www
          mkdir -p www

          unzip -p "$SOURCE_ZIP" index.html > www/index.html
          unzip -p "$SOURCE_ZIP" kbuild-logo.png > www/kbuild-logo.png

          echo "REAL index.html size:"
          wc -c www/index.html

          echo "Checking real website..."

          grep -q "Construction Marketplace" www/index.html

          if grep -q "KBuild Network mobile application" www/index.html; then
            echo "ERROR: Placeholder detected!"
            exit 1
          fi

          echo "REAL KBuild Network interface confirmed."

      - name: Create Capacitor configuration
        run: |
          rm -f capacitor.config.ts
          rm -f capacitor.config.json

          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.kbuild.network",
            "appName": "KBuild Network",
            "webDir": "www"
          }
          EOF

      - name: Create package.json
        run: |
          cat > package.json <<'EOF'
          {
            "name": "kbuild-network-mobile",
            "version": "2.0.0",
            "private": true,
            "dependencies": {
              "@capacitor/core": "^7.4.3"
            },
            "devDependencies": {
              "@capacitor/cli": "^7.4.3",
              "@capacitor/android": "^7.4.3"
            }
          }
          EOF

      - name: Install dependencies
        run: |
          npm install

      - name: Create Android project
        run: |
          rm -rf android
          npx cap add android

      - name: Sync REAL website
        run: |
          npx cap sync android

      - name: Verify Android contains REAL website
        run: |
          test -f android/app/src/main/assets/public/index.html

          echo "Bundled index size:"
          wc -c android/app/src/main/assets/public/index.html

          grep -q "Construction Marketplace" \
            android/app/src/main/assets/public/index.html

          if grep -q "KBuild Network mobile application" \
            android/app/src/main/assets/public/index.html; then
            echo "ERROR: Placeholder reached Android bundle!"
            exit 1
          fi

          echo "SUCCESS: REAL KBuild Network interface is inside Android."

      - name: Build REAL APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew clean
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        run: |
          test -f android/app/build/outputs/apk/debug/app-debug.apk

          echo "REAL APK:"
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload REAL KBuild APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: KBuild-Network-REAL-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
