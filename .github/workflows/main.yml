name: KBuild Network Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Show versions
        run: |
          node --version
          npm --version
          java --version

      - name: Install dependencies
        run: npm install

      - name: Create web directory
        run: |
          mkdir -p www
          if [ ! -f www/index.html ]; then
            cat > www/index.html <<'EOF'
          <!DOCTYPE html>
          <html>
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>KBuild Network</title>
          </head>
          <body>
            <h1>KBuild Network</h1>
          </body>
          </html>
          EOF
          fi

      - name: Update Capacitor config
        run: |
          cat > capacitor.config.ts <<'EOF'
          import type { CapacitorConfig } from '@capacitor/cli';

          const config: CapacitorConfig = {
            appId: 'com.kbuild.network',
            appName: 'KBuild Network',
            webDir: 'www'
          };

          export default config;
          EOF

      - name: Add Android platform
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build Android APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Verify APK
        run: |
          ls -lh android/app/build/outputs/apk/debug/
          test -f android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KBuild-Network-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
